<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goal Details | Saving Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="form-page">
        <a href="index.html">Back to dashboard</a>

        <h1 id="goal-name">Goal Details</h1>

        <section class="goal-details">
            <p id="target-amount">Target: £0.00</p>
            <p id="saved-amount">Saved: £0.00</p>
            <p id="goal-status">Status:</p>
            <p id="goal-deadline">Deadline:</p>
        </section>

        <section>
            <h2>Add Contribution</h2>

            <form id="contribution-form">
                <label for="contribution-amount">Amount</label>

                <input
                    type="number"
                    id="contribution-amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="contribution-note">Note</label>

                <input
                    type="text"
                    id="contribution-note"
                    placeholder="Optional note"
                >

                <button type="submit">Add Contribution</button>
            </form>

            <p id="contribution-message"></p>
        </section>
        
        <section>
            <h2>Contributions</h2>

            <div id="contributions-list">
                <p>No contributions yet.</p>
            </div>
        </section>

        <p id="error-message"></p>
    </main>

    <script src="goal-details.js"></script>
</body>
</html>
