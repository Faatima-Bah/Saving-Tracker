<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Goal | Saving Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="form-page">
        <h1>Create a Savings Goal</h1>

        <form id="create-goal-form">
            <label for="goal-name">Goal name</label>
            <input type="text" id="goal-name" required>

            <label for="target-amount">Target amount</label>
            <input type="number" id="target-amount" min="1" step="0.01" required>

            <label for="deadline">Deadline</label>
            <input type="date" id="deadline" required>

            <button type="submit">Create Goal</button>
        </form>

        <p id="form-message"></p>

        <a href="index.html">Back to dashboard</a>
    </main>

    <script src="create-goal.js"></script>
</body>
</html>
